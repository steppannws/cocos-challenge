# Market → search → order sheet → MARKET BUY of 2 shares → result → Portfolio → Orders → Account.
# Needs the API online and a candidate with cash (the default .env candidate starts with 1,000,000 ARS).
# No hideKeyboard: on iOS Maestro implements it with a blind tap. Taps on a title dismiss it instead.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'market-screen'
    timeout: 120000
- extendedWaitUntil:
    visible:
      id: 'instrument-row-DYCA'
    timeout: 30000
- takeScreenshot: market
- tapOn:
    id: 'market-search'
- inputText: 'CAP'
- extendedWaitUntil:
    visible:
      id: 'instrument-row-CAPX'
    timeout: 15000
- takeScreenshot: market-search
- tapOn:
    id: 'market-search-clear'
- tapOn:
    id: 'market-title'
- extendedWaitUntil:
    visible:
      id: 'instrument-row-DYCA'
    timeout: 15000
- tapOn:
    id: 'instrument-row-DYCA'
- extendedWaitUntil:
    visible:
      id: 'order-sheet'
    timeout: 15000
- takeScreenshot: order-sheet
- tapOn:
    id: 'order-quantity'
- inputText: '2'
- tapOn:
    id: 'order-title'
- takeScreenshot: order-form
- tapOn:
    id: 'order-submit'
- extendedWaitUntil:
    visible:
      id: 'order-result'
    timeout: 30000
- takeScreenshot: order-result
- tapOn:
    id: 'order-done'
# The modal animates out; the tab bar is not hittable until it is gone.
- extendedWaitUntil:
    notVisible:
      id: 'order-sheet'
    timeout: 10000
- tapOn:
    id: 'tab-portfolio'
- extendedWaitUntil:
    visible:
      id: 'holding-row-DYCA'
    timeout: 30000
- takeScreenshot: portfolio
- tapOn:
    id: 'tab-orders'
- extendedWaitUntil:
    visible:
      id: 'orders-list'
    timeout: 30000
- takeScreenshot: orders
- tapOn:
    id: 'tab-account'
- extendedWaitUntil:
    visible:
      id: 'account-screen'
    timeout: 15000
- takeScreenshot: account
